name: Build MSIX

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

jobs:
    build:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'

            - name: Decode signing certificate
              shell: pwsh
              env:
                  CERT_BASE64: ${{ secrets.MSIX_SIGNING_CERT_BASE64 }}
              run: |
                  if ([string]::IsNullOrWhiteSpace($env:CERT_BASE64)) {
                      Write-Host "No signing certificate secret found. Skipping."
                      exit 0
                  }
                  $bytes = [Convert]::FromBase64String($env:CERT_BASE64)
                  [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\signing.pfx", $bytes)

            - name: Build MSIX
              shell: pwsh
              env:
                  CERT_PASSWORD: ${{ secrets.MSIX_SIGNING_CERT_PASSWORD }}
              run: |
                  $certArgs = @{}
                  if (Test-Path "$env:RUNNER_TEMP\signing.pfx") {
                    $certArgs["CertificatePath"] = "$env:RUNNER_TEMP\signing.pfx"
                    $certArgs["CertificatePassword"] = $env:CERT_PASSWORD
                  }
                  .\build_msix.ps1 -Configuration Release -Platform x64 `
                    -PackageVersion "1.0.${{ github.run_number }}.0" `
                    @certArgs

            - name: Upload MSIX artifact
              uses: actions/upload-artifact@v4
              with:
                  name: Volumetric-msix-x64
                  path: artifacts/**/*.msix
                  if-no-files-found: error
